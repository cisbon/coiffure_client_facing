<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coiffure Digital – Passwort festlegen</title>
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">

    <script src="js/i18n.js"></script>

    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: var(--sp-4);
            background:
                radial-gradient(1100px 520px at 50% -10%, var(--brand-100), transparent 70%),
                var(--bg);
        }
        .invite-card { width: 100%; max-width: 460px; padding: var(--sp-8); }
        .invite-logo {
            width: 52px; height: 52px; margin: 0 auto var(--sp-4);
            border-radius: var(--r-lg);
            background: linear-gradient(135deg, var(--brand-400), var(--brand-600));
            display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1.25rem;
        }
    </style>
</head>
<body>
    <main class="card invite-card">
        <div class="invite-logo" aria-hidden="true">CD</div>
        <div id="content">
            <div class="skeleton skeleton-row"></div>
            <div class="skeleton skeleton-row"></div>
            <div class="skeleton skeleton-row"></div>
        </div>
    </main>

    <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>

    <script>
        const API_BASE_URL = window.API_BASE_URL || 'https://clouedo.com/coiffure/api';
        const content = document.getElementById('content');
        const token = new URLSearchParams(window.location.search).get('token') || '';

        function esc(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function t(key, fallback) {
            if (window.i18n && i18n.translations && Object.keys(i18n.translations).length) {
                const value = i18n.t(key);
                if (value !== key) return value;
            }
            return fallback;
        }

        function showError(title, text) {
            content.innerHTML = `
                <div style="text-align:center">
                    <h1>${esc(title)}</h1>
                    <p class="page-subtitle" style="margin-top:var(--sp-2)">${esc(text)}</p>
                    <a class="btn btn-secondary" href="login.html" style="margin-top:var(--sp-6)">
                        ${esc(t('admin.invite.to_login', 'Zur Anmeldung'))}
                    </a>
                </div>`;
        }

        /** Step 1: check the token and learn who this invitation is for. */
        async function load() {
            if (!token) {
                showError(
                    t('admin.invite.invalid_title', 'Ungültiger Link'),
                    t('admin.invite.invalid_text', 'Diese Einladung ist ungültig oder abgelaufen.')
                );
                return;
            }

            try {
                const response = await fetch(
                    `${API_BASE_URL}/auth-set-password.php?token=${encodeURIComponent(token)}`
                );
                const data = await response.json();

                if (!data.success) {
                    showError(
                        t('admin.invite.invalid_title', 'Ungültiger Link'),
                        data.error || t('admin.invite.invalid_text', 'Diese Einladung ist ungültig oder abgelaufen.')
                    );
                    return;
                }

                renderForm(data.invitation);
            } catch (error) {
                showError(
                    t('admin.errors.network', 'Verbindungsfehler'),
                    t('admin.invite.network_text', 'Der Server ist nicht erreichbar. Bitte später erneut versuchen.')
                );
            }
        }

        function renderForm(invitation) {
            content.innerHTML = `
                <div style="text-align:center;margin-bottom:var(--sp-8)">
                    <h1>${esc(t('admin.invite.title', 'Willkommen!'))}</h1>
                    <p class="page-subtitle" style="margin-top:var(--sp-2)">
                        ${esc(t('admin.invite.subtitle', 'Legen Sie Ihr Passwort fest, um loszulegen.'))}
                    </p>
                </div>

                <div class="alert alert-info" style="margin-bottom:var(--sp-6)">
                    <div>
                        <div class="alert-title">${esc(invitation.salon_name || '')}</div>
                        <div class="text-sm">${esc(invitation.email)}</div>
                    </div>
                </div>

                <form id="invite-form" novalidate>
                    <div class="form-grid">
                        <div class="field">
                            <label class="field-label" for="username">
                                ${esc(t('admin.users.username', 'Benutzername'))}<span class="req">*</span>
                            </label>
                            <input class="input" id="username" name="username" required
                                   value="${esc(invitation.suggested_username || '')}"
                                   pattern="[a-zA-Z0-9_-]{3,50}" autocapitalize="none" spellcheck="false">
                        </div>
                        <div class="field">
                            <label class="field-label" for="password">
                                ${esc(t('admin.invite.password', 'Passwort'))}<span class="req">*</span>
                            </label>
                            <input class="input" id="password" name="password" type="password"
                                   required minlength="8" autocomplete="new-password">
                            <span class="field-hint">${esc(t('admin.validation.password_min', 'Mindestens 8 Zeichen.'))}</span>
                        </div>
                        <div class="field">
                            <label class="field-label" for="confirm">
                                ${esc(t('admin.profile.confirm_password', 'Passwort bestätigen'))}<span class="req">*</span>
                            </label>
                            <input class="input" id="confirm" name="confirm" type="password"
                                   required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit">
                            ${esc(t('admin.invite.submit', 'Passwort festlegen und anmelden'))}
                        </button>
                    </div>
                </form>`;

            document.getElementById('invite-form').addEventListener('submit', submit);
        }

        async function submit(event) {
            event.preventDefault();

            const form = event.target;
            const button = document.getElementById('submit');
            form.querySelectorAll('[data-error]').forEach((n) => n.remove());
            form.querySelectorAll('.is-invalid').forEach((n) => n.classList.remove('is-invalid'));

            const username = form.username.value.trim();
            const password = form.password.value;
            const confirm = form.confirm.value;

            const errors = {};
            if (!/^[a-zA-Z0-9_-]{3,50}$/.test(username)) {
                errors.username = t('admin.validation.username', '3–50 Zeichen, nur Buchstaben, Zahlen, _ und -.');
            }
            if (password.length < 8) {
                errors.password = t('admin.validation.password_min', 'Mindestens 8 Zeichen.');
            }
            if (password !== confirm) {
                errors.confirm = t('admin.validation.password_match', 'Die Passwörter stimmen nicht überein.');
            }

            if (Object.keys(errors).length) {
                showFieldErrors(form, errors);
                return;
            }

            const original = button.textContent;
            button.disabled = true;
            button.textContent = t('admin.common.saving', 'Wird gespeichert …');

            try {
                const response = await fetch(`${API_BASE_URL}/auth-set-password.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, username, password }),
                });
                const data = await response.json();

                if (!data.success) {
                    if (data.details?.fields) showFieldErrors(form, data.details.fields);
                    else showError(t('admin.errors.generic', 'Fehler'), data.error || '');
                    button.disabled = false;
                    button.textContent = original;
                    return;
                }

                // The endpoint signs the invitee in, so go straight to the dashboard.
                localStorage.setItem('session_token', data.session_token);
                localStorage.setItem('user_data', JSON.stringify(data.user));
                window.location.replace('admin-dashboard.html');
            } catch (error) {
                button.disabled = false;
                button.textContent = original;
                showError(
                    t('admin.errors.network', 'Verbindungsfehler'),
                    t('admin.invite.network_text', 'Der Server ist nicht erreichbar. Bitte später erneut versuchen.')
                );
            }
        }

        function showFieldErrors(form, errors) {
            Object.entries(errors).forEach(([field, message]) => {
                const input = form.elements[field];
                if (!input) return;
                input.classList.add('is-invalid');
                const wrapper = input.closest('.field');
                if (wrapper) {
                    const node = document.createElement('p');
                    node.className = 'field-error';
                    node.setAttribute('data-error', '');
                    node.textContent = `⚠ ${message}`;
                    wrapper.appendChild(node);
                }
            });
        }

        load();
    </script>
</body>
</html>
