<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coiffure Digital – Dashboard</title>
    <meta name="description" content="Coiffure Digital Salon-Dashboard">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">

    <!--
        Gate the page before anything paints. js/admin/app.js re-checks with the
        server via api/me.php; this only avoids flashing the shell at a visitor
        who is signed out.
    -->
    <script>
        (function () {
            if (!localStorage.getItem('session_token') || !localStorage.getItem('user_data')) {
                window.location.replace('login.html');
            }
        })();
    </script>

    <!--
        js/i18n.js auto-initialises unless told otherwise. The dashboard resolves
        the language itself (profile preference first) in app.js, so opt out.
    -->
    <script>window.skipI18nAutoInit = true;</script>
    <script src="js/i18n.js"></script>

    <!--
        Chart.js for the dashboard charts and QRCode.js for social-link QR codes.
        Both come from a CDN because the repo is served statically by GitHub
        Pages with no build step - the same approach index.html already takes.
    -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
    <div class="app" id="app">
        <!-- ==================== Sidebar ==================== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand" id="sidebar-brand">
                <div class="sidebar-logo" aria-hidden="true">–</div>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav" aria-label="Navigation">
                <!-- Built at runtime from the user's permissions (app.js renderSidebar) -->
            </nav>

            <div class="sidebar-footer">
                <span data-i18n="admin.app_name">Coiffure Digital</span>
            </div>
        </aside>

        <!-- ==================== Impersonation banner ==================== -->
        <div class="impersonation-bar hidden" id="impersonation-bar" role="status"></div>

        <!-- ==================== Top bar ==================== -->
        <header class="topbar">
            <button type="button" class="topbar-menu" id="topbar-menu" aria-label="Menü">
                <span aria-hidden="true">☰</span>
            </button>

            <div id="salon-switcher" class="salon-switcher"></div>

            <div class="topbar-spacer"></div>

            <div id="notif-host" style="position:relative">
                <button type="button" class="icon-btn" id="notif-bell"
                        aria-haspopup="true" aria-expanded="false" aria-label="Benachrichtigungen">
                    <span aria-hidden="true">🔔</span>
                </button>
            </div>

            <div id="lang-switcher" class="lang-switcher"></div>

            <div id="avatar-menu" style="position:relative"></div>
        </header>

        <!-- ==================== View container ==================== -->
        <main class="main" id="view">
            <div class="grid grid-4">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </main>
    </div>

    <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>

    <noscript>
        <div style="padding:2rem">
            <div class="alert alert-warning">
                Für das Dashboard wird JavaScript benötigt.
                &mdash; JavaScript is required to use the dashboard.
            </div>
        </div>
    </noscript>

    <script type="module" src="js/admin/app.js"></script>
</body>
</html>
