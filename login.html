<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalonLyft - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">SalonLyft</h1>
            <p class="text-gray-600">Sign in to your account</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-6">
            <!-- Alert Container -->
            <div id="alertContainer" class="hidden"></div>

            <!-- Username Field -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                    Username or Email
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                    placeholder="Enter your username"
                    autocomplete="username"
                >
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >
            </div>

            <!-- Remember Me -->
            <div class="flex items-center justify-between">
                <label class="flex items-center">
                    <input type="checkbox" id="rememberMe" class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500">
                    <span class="ml-2 text-sm text-gray-600">Remember me</span>
                </label>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                id="loginButton"
                class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 px-4 rounded-lg font-semibold hover:from-purple-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 transition duration-200 transform hover:scale-[1.02]"
            >
                Sign In
            </button>
        </form>

        <!-- Default Credentials Info (for demo) -->
        <div class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
            <p class="text-xs text-blue-800 font-semibold mb-1">Default Admin Credentials:</p>
            <p class="text-xs text-blue-700">Username: <code class="bg-blue-100 px-1 rounded">admin</code></p>
            <p class="text-xs text-blue-700">Password: <code class="bg-blue-100 px-1 rounded">admin123</code></p>
            <p class="text-xs text-blue-600 mt-2 italic">⚠️ Change this password after first login!</p>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'https://clouedo.com/coiffure/api';  // Update with your API URL

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const alertContainer = document.getElementById('alertContainer');

        // Show alert message
        function showAlert(message, type = 'error') {
            const bgColor = type === 'error' ? 'bg-red-100 border-red-400 text-red-700' : 'bg-green-100 border-green-400 text-green-700';
            alertContainer.className = `p-4 mb-4 border rounded-lg ${bgColor}`;
            alertContainer.textContent = message;
            alertContainer.classList.remove('hidden');

            // Auto-hide after 5 seconds
            setTimeout(() => {
                alertContainer.classList.add('hidden');
            }, 5000);
        }

        // Handle login form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showAlert('Please enter both username and password', 'error');
                return;
            }

            // Disable button and show loading state
            loginButton.disabled = true;
            loginButton.textContent = 'Signing in...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth-login.php`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Store session token
                    const sessionToken = data.session_token;
                    localStorage.setItem('session_token', sessionToken);
                    localStorage.setItem('user_data', JSON.stringify(data.user));

                    // Show success message
                    showAlert('Login successful! Redirecting...', 'success');

                    // Redirect based on role
                    setTimeout(() => {
                        if (['admin', 'admin_delegate'].includes(data.user.role)) {
                            window.location.href = 'admin-dashboard.html';
                        } else if (['customer_admin', 'customer_admin_delegate'].includes(data.user.role)) {
                            window.location.href = 'admin-dashboard.html';  // Same dashboard, different permissions
                        } else {
                            window.location.href = 'index.html';  // Regular user goes to main app
                        }
                    }, 1000);
                } else {
                    showAlert(data.error || 'Login failed. Please try again.', 'error');
                    loginButton.disabled = false;
                    loginButton.textContent = 'Sign In';
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Network error. Please check your connection and try again.', 'error');
                loginButton.disabled = false;
                loginButton.textContent = 'Sign In';
            }
        });

        // Check if already logged in
        const sessionToken = localStorage.getItem('session_token');
        if (sessionToken) {
            // Validate session with backend
            fetch(`${API_BASE_URL}/user-management.php`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${sessionToken}`
                }
            }).then(response => {
                if (response.ok) {
                    // Already logged in, redirect
                    const userData = JSON.parse(localStorage.getItem('user_data') || '{}');
                    if (['admin', 'admin_delegate', 'customer_admin', 'customer_admin_delegate'].includes(userData.role)) {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }
            }).catch(() => {
                // Session invalid, clear storage
                localStorage.removeItem('session_token');
                localStorage.removeItem('user_data');
            });
        }
    </script>
</body>
</html>
